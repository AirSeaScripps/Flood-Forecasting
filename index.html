<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coastal flood forecasts</title>
<!-- Page made by TRIM_Storm (trim-storm publish). It reads data/latest.json; no server code. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --bg: #ffffff; --fg: #1d2329; --muted: #5d6873; --line: #dde2e7; --card: #f6f8fa; --link: #0b62a3;
    --warn-bg: #fff4d6; --warn-fg: #6b4d00;
    --r0: #6b8f71; --r1: #e3b505; --r2: #e07b00; --r3: #c8341f; --r4: #7d1f6b; --na: #9aa4ad;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181c; --fg: #e4e8ec; --muted: #9aa5b0; --line: #2c343c; --card: #1b2127; --link: #6cb6f2;
            --warn-bg: #3d3112; --warn-fg: #f2d68a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 0; }
  a { color: var(--link); }
  .muted { color: var(--muted); }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 12px 0;
          font-size: 0.92rem; }
  .stale { background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 2px 8px; font-size: 0.85rem; }
  .sitebar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
  .sitebtn { font: inherit; font-size: 0.92rem; font-weight: 600; padding: 7px 15px; border-radius: 999px;
             border: 1px solid rgba(0,0,0,.18); cursor: pointer; }
  .sitebtn[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
  .sitebtn:disabled { background: var(--card); color: var(--muted); border-color: var(--line); font-weight: 500;
                      cursor: not-allowed; opacity: .7; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; margin-bottom: 16px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  section.site { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin: 16px 0; }
  .site-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 8px; }
  .badge { color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 0.85rem; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px;
          margin-top: 14px; }
  .outlook { margin: 4px 0 12px; }
  .locmap { height: 110px; border: 1px solid var(--line); border-radius: 6px; margin: 4px 0 12px; }
  .locmap .leaflet-tooltip { padding: 1px 5px; font-size: 11px; }
  .pmap { height: 420px; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0 4px; }
  .pluvial h3 { font-size: 1rem; margin: 16px 0 2px; }
  .pluvial .legend { margin: 4px 0 2px; }
  .sq { display: inline-block; width: 14px; height: 11px; margin-right: 4px; vertical-align: -1px; border-radius: 2px; }
  .outlook p { margin: 4px 0; }
  figure { margin: 0; }
  figure img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--link); }
  footer { padding-bottom: 28px; font-size: 0.85rem; }
  footer .src-h { margin-bottom: 4px; font-weight: 600; }
  footer ul { margin: 0 0 10px; padding-left: 20px; list-style: disc outside; }
  footer li { display: list-item; }
  /* interactive forecast of the selected site */
  :root { --grid: #eceff2; --past: #f1f3f5; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --crit: #d03b3b;
          --water: #9ec5f4; --land: #e9dcc4; --land-line: #8a7550; }
  @media (prefers-color-scheme: dark) {
    :root { --grid: #232a31; --past: #1a1f24; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
            --water: #1c5cab; --land: #4a4232; --land-line: #b19a6e; }
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px;
          padding: 4px 12px; font: inherit; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }
  .chip .sw { margin: 0; }
  .detail-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 6px 0 2px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .layout > aside { order: -1; } }
  .readout { position: sticky; top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
             padding: 12px 14px; z-index: 5; }
  @media (max-width: 860px) { .readout { top: 0; border-radius: 0 0 8px 8px; padding: 8px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.08); } }
  .ro-time { font-weight: 600; }
  .ro-tag { font-size: .78rem; color: var(--muted); }
  .ro-risk { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; margin: 6px 0 8px; }
  .ro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  @media (max-width: 860px) { .ro-grid { grid-template-columns: repeat(4, 1fr); gap: 4px 8px; } .ro-more { display: none; } }
  .stat .v { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  @media (max-width: 860px) { .stat .v { font-size: 1rem; } }
  .stat .k { font-size: .76rem; color: var(--muted); line-height: 1.25; }
  .ro-more { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted);
             font-variant-numeric: tabular-nums; }
  .ro-more div { display: flex; justify-content: space-between; gap: 8px; }
  .ro-more b { color: var(--fg); font-weight: 500; text-align: right; }
  .stack { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none; }
  .stack:focus-visible { box-shadow: 0 0 0 2px var(--s1); border-radius: 6px; }
  .panel svg, .panel canvas { display: block; width: 100%; }
  /* each plot and its legend in a light box; box-shadow (not border/padding) keeps the plots exactly the stack's
     width, so the hour cursor stays aligned with every plot */
  .stack .panel { box-shadow: 0 0 0 1px var(--line); border-radius: 6px; margin: 0 0 10px; padding: 0 0 4px; }
  .stack .panel .ptitle { padding: 0 8px; }
  .runup { box-shadow: 0 0 0 1px var(--line); border-radius: 6px; padding: 0 8px 6px; }
  .ptitle { font-size: .8rem; color: var(--muted); margin: 6px 0 0; display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
  .ptitle b { color: var(--fg); font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 4px; }
  .key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; }
  .key i.band { height: 9px; border: 0; opacity: .35; }
  .key i.dash { border-top-style: dashed; }
  .key i.pt { width: 6px; height: 6px; border: 0; border-radius: 50%; }
  .key i.hatch { height: 9px; border: 0; opacity: .7; background: repeating-linear-gradient(135deg, var(--crit) 0 2px, transparent 2px 5px); }
  .cursor { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--fg); pointer-events: none; z-index: 3; }
  .cursor::before { content: ""; position: absolute; top: -2px; left: -6px; border: 5px solid transparent; border-top: 7px solid var(--fg); }
  .hint { font-size: .82rem; color: var(--muted); margin: 2px 0 6px; }
  .runup { margin-top: 18px; }
  .obsline { margin: 6px 0 10px; font-size: .9rem; }
  .obsbtn { display: inline-block; font-weight: 600; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--link);
            color: var(--link); text-decoration: none; }
  .obsbtn:hover { background: var(--card); }
  details.more { margin: 18px 0; border-top: 1px solid var(--line); padding-top: 10px; }
  :root { --fmwin: rgba(240, 190, 30, .28); --hz-bf: #b0478f; }
  .hazards { margin: 2px 0 10px; font-size: .95rem; }
  .hazards > div { margin: 2px 0; padding-left: 16px; text-indent: -16px; }   /* wrapped text lines up after the dot */
  .hazards .sw { margin-right: 4px; }
  .ro-hz { font-size: .84rem; margin: -2px 0 8px; }
  .ro-hz div { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 8px; }
  .ro-hz div > span { white-space: nowrap; }
  .ro-hz b { font-weight: 500; text-align: right; margin-left: auto; }
  .floodmap { margin: 8px 0 18px; }
  .floodmap h3 { margin: 6px 0 2px; font-size: 1.05rem; }
  .fm-stats { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 6px 0; }
  .fm-stats .v { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fm-stats .k { font-size: .78rem; color: var(--muted); }
  .fm-map { height: 380px; }

</style>
</head>
<body>
<header>
  <h1 id="title">Coastal flood forecasts</h1>
  <div id="description" class="muted"></div>
  <div id="updated" class="muted"></div>
  <div id="disclaimer" class="note"></div>
</header>
<main>
  <nav class="sitebar" id="sitechips" aria-label="Sites"></nav>
  <div class="legend" id="legend"></div>
  <div id="sites"><p class="muted">Loading forecasts...</p></div>
</main>
<footer class="muted">
  <div id="sources"></div>
  <p>Total Water Level (TWL) and compound flood forecasting made with TRIM_Storm <span id="version"></span><br>
  Times are local to each site. Data: <a href="data/latest.json">latest.json</a> &middot; <a href="data/history.csv">history.csv</a>
  &middot; <a href="data/latest_forecast.geojson">GeoJSON</a>.</p>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  "use strict";
  const COLORS = ["--r0", "--r1", "--r2", "--r3", "--r4"].map(v =>
    getComputedStyle(document.documentElement).getPropertyValue(v).trim());
  const NA = getComputedStyle(document.documentElement).getPropertyValue("--na").trim();
  const el = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
    }
    for (const k of kids) if (k !== null && k !== undefined) e.append(k);
    return e;
  };
  const pct = p => (p === null || p === undefined) ? "–" : Math.round(100 * p) + "%";
  const m = v => (v === null || v === undefined) ? "–" : v.toFixed(2) + " m";
  const color = lv => (lv === null || lv === undefined) ? NA : COLORS[Math.max(0, Math.min(4, Math.round(lv)))];
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  // Risk labels with the site's word for exceeding its thresholds ("flooding" by default).
  const siteLabels = (labels, term) => labels.map(l => l.replace("flooding", term || "flooding"));
  const LEVEL_PHRASE = ["low chance on any single tide", "minor possible", "minor likely",
                        "moderate possible", "moderate likely"];
  // "Thu, Nov 5, 6–8 AM": one window of consecutive hours, in the site's time zone
  function span(a, b, tz) {
    const A = new Date(a), B = new Date(b);
    const f = (d, o) => new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: tz || undefined }, o)).format(d);
    const day = d => f(d, { weekday: "short", month: "short", day: "numeric" });
    const hr = d => f(d, { hour: "numeric" });
    if (A.getTime() === B.getTime()) return day(A) + ", " + hr(A);
    if (day(A) !== day(B)) return day(A) + ", " + hr(A) + " – " + day(B) + ", " + hr(B);
    const [ha, pa] = hr(A).split(" "), [hb, pb] = hr(B).split(" ");
    return day(A) + ", " + (pa === pb ? ha : hr(A)) + "–" + hr(B);
  }
  function outlook(S, labels) {
    const box = el("div", { class: "outlook" });
    const term = S.hazard_term || "flooding";
    const days = S.forecast_days ? Math.round(S.forecast_days) : null;
    for (const t of S.transects) {
      if (t.max_risk_level === null || t.max_risk_level === undefined) continue;
      const lv = Math.round(t.max_risk_level);
      const p = el("p", {}, el("b", {}, cap(term) + (S.transects.length > 1 ? " (" + t.transect_id + ")" : "") + ": "),
        LEVEL_PHRASE[lv] + " (highest " + pct(t.max_P_minor) + ", " + when(t.time_max_P_minor, S.local_tz) + "). ");
      if (t.P_any_minor !== null && t.P_any_minor !== undefined) {
        p.append(el("b", {}, pct(t.P_any_minor) + " chance"), " of " + term + " on at least one tide" +
          (days ? " in the next " + days + " days" : "") +
          (t.P_any_moderate ? " (moderate: " + pct(t.P_any_moderate) + ")" : "") + ".");
      }
      box.append(p);
    }
    const dr = S.drains;
    if (dr && dr.max_pct_closed !== null && dr.max_pct_closed !== undefined) {
      const p = el("p", {}, el("b", {}, "Storm drains: "), "high tides close up to " + Math.round(dr.max_pct_closed) +
        "% of the " + (dr.n_inlets || "") + " bay-connected inlets (" + when(dr.time_max_utc, S.local_tz) + "). ");
      const w = dr.backflow_windows || [];
      if (w.length) {
        const n = Math.max(...w.map(x => x.max_inlets || 1));
        p.append(el("b", {}, "Drain backflow flooding possible"),
          " at " + n + " inlet" + (n > 1 ? "s" : "") + ": " + w.map(x => span(x.start_utc, x.end_utc, S.local_tz)).join("; ") + ".");
      } else {
        p.append("No drain backflow expected.");
      }
      box.append(p);
    }
    const rn = dr && dr.rain;
    if (rn && rn.error) {
      box.append(el("p", {}, el("b", {}, "Rain: "), "the rain forecast could not be read for this run, so rain " +
        "while drains are closed is not checked."));
    } else if (rn) {
      const r = rn.rule || {}, tz = S.local_tz;
      const src = rn.cycle_utc ? " (" + (rn.source || "NBM") + " forecast issued " + when(rn.cycle_utc, tz) + ")" : "";
      const p = el("p", {}, el("b", {}, "Rain"), src + ": ");
      if (!rn.total_mm) {
        p.append("none forecast.");
      } else {
        p.append(num(rn.total_mm, 1) + " mm over the forecast, at most " + num(rn.max_mm_h, 1) + " mm/h (" +
          when(rn.time_max_utc, tz) + "). ");
        const cw = rn.compound_windows || [], lw = rn.closed_windows || [];
        const pc = r.pct_closed !== undefined ? Math.round(r.pct_closed) : 50;
        if (cw.length) {
          p.append(el("b", {}, "Compound flooding possible"), ": rain of " + r.compound_mm_h + " mm/h or more while at least " +
            pc + "% of drains are closed, " + cw.map(w => span(w.start_utc, w.end_utc, tz)).join("; ") + ". ");
        }
        if (lw.length) {
          p.append(el("b", {}, "Rain while most drains are closed"), ": " + lw.map(w => span(w.start_utc, w.end_utc, tz) +
            " (" + num(w.rain_mm, 1) + " mm, up to " + num(w.max_rain_mm_h, 1) + " mm/h; " + Math.round(w.max_pct_closed) +
            "% of inlets closed)").join("; ") +
            (cw.length ? "." : ". Light: below the " + r.compound_mm_h + " mm/h compound-flooding threshold."));
        } else {
          p.append("No rain while most drains are closed.");
        }
        const up = rn.upper;
        if (up) {
          p.append(el("span", { class: "muted" }, " NBM " + up.percentile + "th percentile: " + (up.total_mm > 0
            ? num(up.total_mm, 1) + " mm in total."
            : "0 mm throughout, so NBM's own probabilities give rain less than a " + (100 - up.percentile) +
              "% chance in each 6 h; the amounts above are its single deterministic forecast.")));
        }
      }
      box.append(p);
    }
    for (const pm of (S.pluvial || [])) {
      const w = pm.rain_window_utc || [];
      box.append(el("p", {}, el("b", {}, "Rain ponding: "),
        (pm.kind === "from_compound" ? "while drains are closed" : "wettest " + Math.round((pm.duration_min || 60) / 60) + " h") +
        (w.length === 2 ? " (" + span(w[0], w[1], S.local_tz) + ")" : "") + ", " + num(pm.rain_total_mm, 1) + " mm of rain: " +
        num(pm.area_ha_over_10cm, 1) + " ha deeper than 10 cm, " + num(pm.area_ha_over_30cm, 1) + " ha deeper than 30 cm" +
        " (map below)."));
    }
    return box;
  }
  const num = (v, d) => (v === null || v === undefined) ? "–" : Number(v).toFixed(d);
  // Forecast rain ponding (r.sim.water depth) over OpenStreetMap; one layer per forecast-rain scenario
  // The largest flooding in the next hours (flood_map.json of the pluvial run of this forecast)
  // The three hazards of a site's headline, each with a level 0-4: berm overtopping (the coastal ensemble of each
  // transect) and the drain hazards (backflow; rain while the drains are closed) from drainage.json.
  const phrase = lv => ["none", "minor possible", "minor likely", "moderate possible", "moderate likely"][Math.round(lv)] || "none";
  function siteHazards(S) {
    const out = [];
    const berm = S.transects.filter(t => t.max_risk_level !== null && t.max_risk_level !== undefined);
    if (berm.length) {
      const t = berm.reduce((a, b) => (b.max_risk_level > a.max_risk_level ? b : a));
      out.push({ key: "berm", name: S.hazard_term || "flooding", level: Math.round(t.max_risk_level),
        when: t.max_risk_level >= 3 ? t.time_max_P_moderate : t.time_max_P_minor });
    }
    const hz = (S.drains && S.drains.hazards) || {};
    const score = b => [b.max_risk_level, b.P_moderate_max, b.P_minor_max, b.median_h ?? b.median_mm ?? b.peak_cfs ?? 0];
    const better = (a, b) => { const x = score(a), y = score(b); for (let k = 0; k < x.length; k++) if (x[k] !== y[k]) return y[k] > x[k]; return false; };
    const best = h => (h.spells || []).reduce((a, b) => (!a || better(a, b) ? b : a), null);
    if (hz.backflow) {
      const b = best(hz.backflow);
      out.push({ key: "backflow", name: "drain backflow", level: hz.backflow.max_risk_level, when: b && b.time_max_utc,
        span: b && [b.start_utc, b.end_utc], detail: b ? "~" + Math.round(b.median_h) + " h" : "", n: (hz.backflow.spells || []).length });
    }
    if (hz.rain) {
      const b = best(hz.rain);
      out.push({ key: "rain", name: "rain flooding with closed drains", level: hz.rain.max_risk_level, when: b && b.time_max_utc,
        span: b && [b.start_utc, b.end_utc], detail: b ? "~" + Math.round(b.median_mm) + " mm" : "" });
    }
    const ck = S.creek && S.creek.hazard;
    if (ck) {
      const b = best(ck);
      out.push({ key: "creek", name: "creek and high-tide flooding", level: ck.max_risk_level, when: b && b.time_max_utc, headline: S.creek.in_headline !== false,
        span: b && [b.start_utc, b.end_utc], detail: b && b.peak_cfs ? (S.creek.name || "creek") + " forecast to ~" + Math.round(b.peak_cfs) + " cfs" : "" });
    }
    return out;
  }
  function hazardLine(S) {
    const hz = siteHazards(S).sort((a, b) => b.level - a.level);
    if (!hz.length) return null;
    const box = el("div", { class: "hazards" });
    hz.forEach(h => {
      const p = el("div", {});
      box.append(p);
      const words = h.level > 0 ? cap(phrase(h.level).replace(/^(minor|moderate) /, "$1 " + h.name + " ")) : "No " + (h.none || h.name);
      p.append(el("span", { class: "sw", style: "background:" + color(h.level) }), el("b", {}, words));
      if (h.level > 0 && (h.span || h.when)) {
        const w = h.span && h.span[0] !== h.span[1] ? span(h.span[0], h.span[1], S.local_tz) : when(h.when, S.local_tz);
        p.append(" (" + w + (h.detail ? ", " + h.detail : "") + (h.n > 1 ? "; " + h.n + " high tides" : "") + ")");
      }
    });
    return box;
  }

  function floodMap(S) {
    const F = S.flood_map;
    if (!F) return null;
    const hrs = Math.round(F.hours || 72), days = hrs % 24 === 0 ? (hrs / 24) + " days" : hrs + " h";
    const box = el("div", { class: "floodmap" });
    const W = F.worst;
    if (!W) {

          stat(f2(H.p50[i], 2) + '<span style="font-size:.7em;font-weight:400"> m</span>', "TWL median (" + f2(H.p05[i], 1) + "–" + f2(H.p95[i], 1) + ")") + "</div>" +
        '<div class="ro-more">' +
          (rule ? row("Compound flooding", H.comp && H.comp[i] ? "⚠ yes" : H.c90 && H.c90[i] ? "⚠ if rain is heavy (90%)" : "no", H.comp && H.comp[i] ? "color:var(--crit)" : "") : "") +
          row("Waves at MOP", f2(H.Hs[i], 2) + " m, " + f2(H.Tp[i], 0) + " s, " + f2(H.Dp[i], 0) + "°") +
          (has(H.sw) ? row("&nbsp;swell / wind waves", f2(H.sw[i], 2) + " / " + f2(H.sea[i], 2) + " m") : "") +
          row("Still water level", f2(H.swl[i], 2) + " m") +
          (H.offset ? row("&nbsp;tide + offset + surge", f2(H.tide[i], 2) + " + " + f2(H.offset[i], 2) + (s !== null && s < 0 ? " − " : " + ") + f2(Math.abs(s ?? 0), 2)) : "") +
          (H.obs && H.obs[i] !== null ? row("&nbsp;observed", f2(H.obs[i], 2) + " m") : "") +
          row("Runup R2", f2(H.R2[i], 2) + " m") + row("Chance of moderate", pc(H.Pmod[i])) +
          (SD.creek && (H.cqo || H.cqm || H.cqs) ? row("Creek flow",
            (H.cqo && H.cqo[i] !== null ? f2(H.cqo[i], 0) + " cfs (observed)" : H.cqs && H.cqs[i] !== null ? f2(H.cqs[i], 0) + " cfs (NWM)" :
             H.cqm && H.cqm[i] !== null ? f2(H.cqm[i], 0) + " cfs (NWM mean)" : "–")) +
            (!(H.cqo && H.cqo[i] !== null) && H.cq0 && H.cq0[i] !== null ? row("&nbsp;NWM member range", f2(H.cq0[i], 0) + "–" + f2(H.cq1[i], 0) + " cfs") : "") +
            (H.Pce ? row("&nbsp;chance elevated / high tide", pc(H.Pce[i]) + " / " + pc(H.Poh[i])) : "") : "") +
          (drains ? row("Drains backing up", H.nbf ? (H.nbf[i] ?? 0) : "–") : "") + "</div>";
    }
    function place() { cursor.style.left = X(H.t[cur]) + "px"; readout(); drawProfile(); }
    function setFromX(px) { const t = T0 + (px - M.l) / (W - M.l - M.r) * (T1 - T0); let b = 0, bd = Infinity;
      for (let i = 0; i < N; i++) { const dd = Math.abs(H.t[i] - t); if (dd < bd) { bd = dd; b = i; } } if (b !== cur) { cur = b; place(); } }
    let drag = false;
    stack.addEventListener("pointerdown", e => { drag = true; stack.setPointerCapture(e.pointerId); setFromX(e.clientX - stack.getBoundingClientRect().left); });
    stack.addEventListener("pointermove", e => { if (drag) setFromX(e.clientX - stack.getBoundingClientRect().left); });
    stack.addEventListener("pointerup", () => drag = false); stack.addEventListener("pointercancel", () => drag = false);
    stack.addEventListener("keydown", e => { const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (!k) return; e.preventDefault();
      cur = Math.max(0, Math.min(N - 1, cur + k * (e.shiftKey ? 24 : 1))); place(); });
    let rt; const onResize = () => { clearTimeout(rt); rt = setTimeout(draw, 120); };
    const mq = matchMedia("(prefers-color-scheme: dark)");
    addEventListener("resize", onResize); mq.addEventListener("change", draw);
    draw();
    return () => { removeEventListener("resize", onResize); mq.removeEventListener("change", draw); };
  }

  function render(D) {
    document.title = D.title;
    document.getElementById("title").textContent = D.title;
    document.getElementById("description").textContent = D.description || "";
    document.getElementById("disclaimer").textContent = D.disclaimer || "";
    document.getElementById("version").textContent = D.trim_storm_version || "";
    DEFAULT_SOURCES = D.data_sources || [];
    sources(DEFAULT_SOURCES);
    document.getElementById("updated").textContent = "Page updated " + when(D.generated_utc) +
      ". Forecasts from the last " + D.days + " days.";
    const labels = D.risk_labels;
    const legend = document.getElementById("legend");
    const terms = [...new Set(D.sites.map(S => S.hazard_term || "flooding"))];   // one shared term: use it in the legend
    labels.forEach((t, i) => legend.append(el("span", {}, el("span", { class: "sw", style: "background:" + COLORS[i] }), t)));

    const now = new Date();
    const box = document.getElementById("sites");
    box.replaceChildren();
    for (const S of D.sites) {
      const issued = new Date(S.issue_utc);
      const ageH = (now - issued) / 3.6e6;
      const stale = ageH > D.stale_hours;
      const hz = siteHazards(S);
      const lv = Math.max(-1, ...hz.filter(h => h.headline !== false).map(h => h.level ?? -1));
      const sl = labels;                                       // the headline: the highest of the hazards
      const sec = el("section", { class: "site", id: "site-" + S.site });
      const head = el("div", { class: "site-head" },
        el("h2", {}, "Summary"),
        el("span", { class: "badge", style: "background:" + color(lv < 0 ? null : lv) }, lv < 0 ? "No data" : sl[Math.round(lv)]),
        el("span", { class: "muted" }, "Issued " + when(S.issue_utc, S.local_tz)),
        stale ? el("span", { class: "stale" }, "Not updated for " + Math.round(ageH) + " h") : null);
      sec.append(head);
      sec.append(outlook(S, labels));

      const hasOv = S.transects.some(t => t.structure_type);
      const hasDr = S.transects.some(t => t.drain_max_pct_closed !== null && t.drain_max_pct_closed !== undefined);
      const hdr = ["Transect", "Highest risk", "Highest P(minor)", "Peak (local)", "P(minor), any tide",
                   "Highest P(moderate)", "Peak TWL (median)", "Minor / moderate threshold"];
      if (hasOv) hdr.push("P(≥2% overtop)");
      if (hasDr) hdr.push("Drains closed (max)");
      const tb = el("tbody");
      for (const t of S.transects) {
        const cells = [t.transect_id,
          el("span", {}, el("span", { class: "sw", style: "background:" + color(t.max_risk_level) }),
             t.max_risk_level === null ? "–" : sl[Math.round(t.max_risk_level)]),
          pct(t.max_P_minor), when(t.time_max_P_minor, S.local_tz), pct(t.P_any_minor), pct(t.max_P_moderate),
          m(t.max_TWL_p50_m),
          m(t.threshold_minor_m) + " / " + m(t.threshold_moderate_m)];
        if (hasOv) cells.push(t.structure_type ? pct(t.max_P_ov_minor) : "–");
        if (hasDr) cells.push(t.drain_max_pct_closed === null ? "–" : Math.round(t.drain_max_pct_closed) + "%");
        tb.append(el("tr", {}, ...cells.map(c => el("td", {}, c))));
      }
      sec.append(el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, ...hdr.map(h => el("th", {}, h)))), tb)));
      const pmaps = pluvialMaps(S);
      if (pmaps) sec.append(pmaps);

      const figs = el("div", { class: "figs" });
      for (const f of S.figures) {
        const src = S.path + f.file;
        figs.append(el("figure", {}, el("a", { href: src }, el("img", { src: src, alt: f.title, loading: "lazy" })),
                       el("figcaption", {}, f.title)));
      }
      if (S.figures.length) sec.append(figs);
      if (S.tables.length) {
        const p = el("p", { class: "muted" }, "Tables: ");
        S.tables.forEach((f, i) => { if (i) p.append(" · "); p.append(el("a", { href: S.path + f.file }, f.file)); });
        sec.append(p);
      }
      if (S.history && S.history.length > 1) {
        const hb = el("tbody");
        for (const h of S.history) {
          hb.append(el("tr", {}, el("td", {}, when(h.issue_utc, S.local_tz)),
            el("td", {}, el("span", { class: "sw", style: "background:" + color(h.max_risk_level) }),
               h.max_risk_level === null ? "–" : sl[Math.round(h.max_risk_level)]),
            el("td", {}, pct(h.max_P_minor)), el("td", {}, pct(h.max_P_moderate)),
            el("td", {}, el("a", { href: h.path + (S.figures[0] ? S.figures[0].file : "") }, "figure"))));
        }
        sec.append(el("details", {}, el("summary", {}, "Earlier forecasts (" + (S.history.length - 1) + ")"),
          el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {},
            ...["Issued", "Highest risk", "P(minor)", "P(moderate)", ""].map(h => el("th", {}, h)))), hb))));
      }
      SECTIONS[S.site] = { S, sec, lv, sl, stale, ageH };
    }
    if (!D.sites.length) box.append(el("p", { class: "muted" }, "No forecasts published yet."));
    // site buttons: published sites coloured by their highest risk; planned sites greyed out
    const chips = document.getElementById("sitechips");
    const buttons = D.buttons || D.sites.map(S => ({ label: S.label || S.site, site: S.site }));
    for (const B of buttons) {
      const R = B.site ? SECTIONS[B.site] : null;
      if (!R) {
        chips.append(el("button", { class: "sitebtn", type: "button", disabled: "", title: "Forecast coming soon" }, B.label));
        continue;
      }
      const bg = color(R.lv < 0 ? null : R.lv);
      const b = el("button", { class: "sitebtn", type: "button", "data-site": B.site, "aria-pressed": "false",
        style: "background:" + bg + ";color:" + ink(bg),
        title: (R.lv < 0 ? "No data" : R.sl[Math.round(R.lv)]) + " (issued " + when(R.S.issue_utc, R.S.local_tz) + ")" }, B.label);
      b.addEventListener("click", () => { history.replaceState(null, "", "#site-" + B.site); select(B.site); });
      chips.append(b);
    }
    const fromHash = decodeURIComponent((location.hash || "").replace(/^#site-/, ""));
    select(SECTIONS[fromHash] ? fromHash : (D.sites[0] && D.sites[0].site));
    addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.replace(/^#site-/, "")); if (SECTIONS[h]) select(h); });
  }
})();
</script>
</body>
</html>
